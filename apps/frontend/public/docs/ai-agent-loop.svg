        <text x="747" y="187" class="detail">OpenRouter completion</text><text x="747" y="211" class="detail">ordered implementation</text><text x="747" y="235" class="detail">steps</text>
      </g>
<g>
        <rect x="1055" y="120" width="250" height="125" rx="18" fill="#fff0d3" stroke="#17211e" stroke-width="2.5"/>
        <circle cx="1079" cy="147" r="6" fill="#e63883"/>
        <text x="1097" y="153" class="label">TOOL DECISION</text>
        <text x="1077" y="187" class="detail">OpenRouter returns one</text><text x="1077" y="211" class="detail">tool call</text><text x="1077" y="235" class="detail">parallel calls disabled</text>
