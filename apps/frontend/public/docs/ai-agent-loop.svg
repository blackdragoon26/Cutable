        <circle cx="749" cy="417" r="6" fill="#2f5e50"/>
        <text x="767" y="423" class="label">E2B WORKSPACE</text>
        <text x="747" y="457" class="detail">file ops · shell · npm</text><text x="747" y="481" class="detail">build · Vite preview</text>
      </g>
<g>
        <rect x="395" y="390" width="250" height="145" rx="18" fill="#dfe8ff" stroke="#17211e" stroke-width="2.5"/>
        <circle cx="419" cy="417" r="6" fill="#e63883"/>
        <text x="437" y="423" class="label">PERSIST + EMIT</text>
        <text x="417" y="457" class="detail">upsert project files in</text><text x="417" y="481" class="detail">Neon</text><text x="417" y="505" class="detail">stream tool result over</text><text x="417" y="529" class="detail">WSS</text>
      </g>
<g>
        <rect x="65" y="390" width="250" height="145" rx="18" fill="#fffefb" stroke="#17211e" stroke-width="2.5"/>
        <circle cx="89" cy="417" r="6" fill="#2f5e50"/>
        <text x="107" y="423" class="label">EXIT CONDITION</text>
        <text x="87" y="457" class="detail">model returns no tool</text><text x="87" y="481" class="detail">calls</text><text x="87" y="505" class="detail">or maximum step/error</text>
      </g>
<g>
        <rect x="395" y="665" width="910" height="105" rx="18" fill="#fffefb" stroke="#17211e" stroke-width="2.5"/>
        <circle cx="419" cy="692" r="6" fill="#2f5e50"/>
        <text x="437" y="698" class="label">ALLOW-LISTED TOOL SURFACE</text>
        <text x="417" y="732" class="detail">write / read / delete / move files   ·   list tree   ·   execute command   ·   add/check dependencies   ·</text><text x="417" y="756" class="detail">test build   ·   start server</text>
      </g></g>
    <text x="65" y="815" fill="#66706c" class="note">The model does not receive host shell access. Commands run with cwd=/home/user/react-app inside E2B.</text>
    <text x="1535" y="858" text-anchor="end" class="edge">CUTABLE / VERIFIED FROM REPOSITORY</text>
  </svg>