        <text x="417" y="187" class="detail">reconnect or create</text><text x="417" y="211" class="detail">restore files from Neon</text>
      </g>
<g>
        <rect x="725" y="120" width="250" height="125" rx="18" fill="#dfe8ff" stroke="#17211e" stroke-width="2.5"/>
        <circle cx="749" cy="147" r="6" fill="#e63883"/>
