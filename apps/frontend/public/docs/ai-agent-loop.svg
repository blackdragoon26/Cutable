<g>
        <rect x="1055" y="390" width="250" height="145" rx="18" fill="#dce9e3" stroke="#17211e" stroke-width="2.5"/>
        <circle cx="1079" cy="417" r="6" fill="#e63883"/>
        <text x="1097" y="423" class="label">GO EXECUTOR</text>
