        <path d="M 725 462.5 L 645 462.5" fill="none" stroke="#43524d" stroke-width="3"  marker-end="url(#arrow)" />
        <rect x="593.4" y="448.5" width="183.2" height="24" rx="8" fill="#f7f5ef"/><text x="685" y="466.5" text-anchor="middle" class="edge">result + changed files</text>
