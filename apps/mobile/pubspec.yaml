name: cutable_mobile
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  dio: ^5.7.0
  flutter_secure_storage: ^9.2.2
  web_socket_channel: ^3.0.1
  flutter_web_auth_2: ^4.1.0
  webview_flutter: ^4.10.0
  shared_preferences: ^2.3.3
  intl: ^0.19.0
  image_picker: ^1.1.2
  file_selector: ^1.0.3
  path: ^1.9.0
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/brand/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/brand/cutable-mark.png"
  # iOS App Store icons must be fully opaque; flatten the mark's
  # transparency onto the web app's light "paper" background
  # (apps/frontend/app/globals.css --background) rather than shipping an
  # icon with alpha, which Xcode/App Store Connect reject.
  background_color: "#F6F6F3"
  remove_alpha_ios: true
  adaptive_icon_background: "#F6F6F3"
  adaptive_icon_foreground: "assets/brand/cutable-mark.png"
