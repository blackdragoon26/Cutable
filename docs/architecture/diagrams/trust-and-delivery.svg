    <text x="62" y="365" fill="#66706c" class="note">External execution boundary: OpenRouter receives inference input; E2B receives generated workspace operations.</text>
    <text x="1535" y="858" text-anchor="end" class="edge">CUTABLE / VERIFIED FROM REPOSITORY</text>
  </svg>