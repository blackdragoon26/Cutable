<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
    <title id="title">Trust, data and delivery</title>
    <desc id="desc">04 / boundaries + reproducible production path</desc>
    <defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#43524d"/></marker>
      <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="7" flood-opacity=".08"/></filter>
    </defs>
    <style>
      text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, sans-serif; fill: #17211e; }
      .title { font-size: 39px; font-weight: 700; letter-spacing: -1.2px; }
      .kicker { font-size: 16px; font-weight: 650; letter-spacing: 1.6px; fill: #2f5e50; }
      .label { font-size: 17px; font-weight: 750; letter-spacing: .5px; }
      .detail { font-size: 16px; fill: #66706c; }
      .edge { font-size: 13px; font-weight: 650; fill: #43524d; }
      .note { font-size: 16px; font-weight: 600; }
    </style>
    <rect width="1600" height="900" fill="#f7f5ef"/>
