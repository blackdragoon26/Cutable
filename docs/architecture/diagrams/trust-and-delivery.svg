        <path d="M 360 200 L 470 200" fill="none" stroke="#43524d" stroke-width="3"  marker-end="url(#arrow)" />
        <rect x="388" y="186" width="54" height="24" rx="8" fill="#f7f5ef"/><text x="415" y="204" text-anchor="middle" class="edge">HTTPS</text>
      </g>
<g>
        <path d="M 770 200 L 880 200" fill="none" stroke="#43524d" stroke-width="3"  marker-end="url(#arrow)" />
        <rect x="775.2" y="186" width="99.6" height="24" rx="8" fill="#f7f5ef"/><text x="825" y="204" text-anchor="middle" class="edge">HTTPS / WSS</text>
