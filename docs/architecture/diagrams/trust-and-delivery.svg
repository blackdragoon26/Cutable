<g>
        <rect x="1380" y="510" width="160" height="125" rx="18" fill="#dce9e3" stroke="#17211e" stroke-width="2.5"/>
        <circle cx="1404" cy="537" r="6" fill="#e63883"/>
        <text x="1422" y="543" class="label">RUNTIME</text>
        <text x="1402" y="577" class="detail">distroless</text><text x="1402" y="601" class="detail">nonroot</text>
      </g>
<g>
        <rect x="1050" y="720" width="490" height="90" rx="18" fill="#fee2e2" stroke="#17211e" stroke-width="2.5"/>
        <circle cx="1074" cy="747" r="6" fill="#e63883"/>
        <text x="1092" y="753" class="label">HOST SECRET FILE</text>
        <text x="1072" y="787" class="detail">0400 · uid 65532 · read-only mount at</text><text x="1072" y="811" class="detail">/run/secrets/cutable.env</text>
