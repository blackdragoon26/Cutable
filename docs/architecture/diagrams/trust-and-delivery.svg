        <circle cx="494" cy="132" r="6" fill="#2f5e50"/>
        <text x="512" y="138" class="label">PUBLIC EDGE</text>
        <text x="492" y="172" class="detail">Vercel frontend</text><text x="492" y="196" class="detail">TLS / HTTPS</text><text x="492" y="220" class="detail">exact backend origin</text>
