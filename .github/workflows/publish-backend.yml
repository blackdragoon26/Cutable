name: Publish backend image

on:
  push:
    branches: [main]
    paths:
      - "apps/backend/**"
      - ".github/workflows/publish-backend.yml"
      - ".dockerignore"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Sign in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish immutable image
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/backend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/cutable-api:sha-${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/cutable-api:main
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Record immutable digest
        run: |
          echo "Image: ghcr.io/${GITHUB_REPOSITORY_OWNER}/cutable-api@${{ steps.image.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Deploy verified image through Myprod
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/cutable-api@${{ steps.image.outputs.digest }}
          MYPROD_DEPLOY_TOKEN: ${{ secrets.MYPROD_CUTABLE_DEPLOY_TOKEN }}
        run: |
          test -n "$MYPROD_DEPLOY_TOKEN"
          jq -n --arg image "$IMAGE" '{image: $image}' |
            curl --fail-with-body --silent --show-error \
              --retry 3 --retry-all-errors \
              --connect-timeout 10 --max-time 180 \
              -H "Authorization: Bearer $MYPROD_DEPLOY_TOKEN" \
              -H "Content-Type: application/json" \
              --data-binary @- \
              https://api.sankalpjha.dev/__poolctl/api/deploy/cutable
