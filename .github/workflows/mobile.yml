name: Mobile

on:
  push:
    branches: [main]
    paths:
      - "apps/mobile/**"
      - ".github/workflows/mobile.yml"
  pull_request:
    paths:
      - "apps/mobile/**"
      - ".github/workflows/mobile.yml"

permissions:
  contents: read

jobs:
  analyze_test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  build_android:
    runs-on: ubuntu-latest
    needs: analyze_test
    defaults:
      run:
        working-directory: apps/mobile
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: cutable-android-release
          path: apps/mobile/build/app/outputs/flutter-apk/app-release.apk

      # Publishes the release APK as a stable-URL GitHub Release asset that
      # the landing page's "Download for Android" button links to directly
      # (apps/frontend/app/components/MobileDownloadButtons.tsx). Only on
      # push to main, mirroring publish-backend.yml's deploy gating, so the
      # "latest" release stays meaningful.
      - name: Publish release APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mobile-latest
          name: Cutable mobile (latest)
          body: Automatically updated on every push to main that touches apps/mobile/**.
          files: apps/mobile/build/app/outputs/flutter-apk/app-release.apk

  build_ios:
    runs-on: macos-latest
    needs: analyze_test
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      # Proves the iOS target compiles. Real code signing and TestFlight
      # upload require Apple Developer credentials this CI does not hold.
      - run: flutter build ios --release --no-codesign
